<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Участник эксперимента</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f6fa; }
    .centered-form { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .form-box { background: #fff; padding: 32px 32px 24px 32px; border-radius: 16px;
                box-shadow: 0 4px 32px #0003; min-width: 360px; max-width: 90vw; }
    .group-card { border: 2px solid #dee2e6; border-radius: 10px; padding: 14px 18px;
                  cursor: pointer; transition: all 0.2s; margin-bottom: 10px; }
    .group-card:hover { border-color: #2196f3; background: #f0f7ff; }
    .group-card.selected { border-color: #2196f3; background: #e3f2fd; }
    .group-card input[type=radio] { margin-right: 10px; }
    .group-label { font-weight: 600; font-size: 15px; }
    .group-desc { font-size: 13px; color: #666; margin-top: 4px; margin-left: 22px; }
  </style>
</head>
<body>
  <div class="centered-form">
    <form id="participantForm" class="form-box">
      <h3 style="margin-top:0;margin-bottom:6px;">Информация об участнике</h3>
      <p style="color:#888;font-size:13px;margin-bottom:24px;">Эксперимент: влияние параллакс-эффекта на чтение текста</p>

      <!-- Номер участника -->
      <div class="mb-3">
        <label for="participantNumber" class="form-label fw-semibold">Номер участника</label>
        <input type="text" class="form-control" id="participantNumber" placeholder="Например: P01"
               required autocomplete="off" style="max-width:200px;">
      </div>

      <!-- Группа -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Версия сайта для чтения</label>
        <div class="group-card" id="cardA" onclick="selectGroup('A')">
          <label style="cursor:pointer;width:100%">
            <input type="radio" name="group" value="A" id="groupA" required>
            <span class="group-label">Группа A — с параллакс-эффектом</span>
            <div class="group-desc">Сайт с анимированным фоном (параллакс-скроллинг)</div>
          </label>
        </div>
        <div class="group-card" id="cardB" onclick="selectGroup('B')">
          <label style="cursor:pointer;width:100%">
            <input type="radio" name="group" value="B" id="groupB" required>
            <span class="group-label">Группа B — без параллакса</span>
            <div class="group-desc">Сайт со статичным фоном (обычная вёрстка)</div>
          </label>
        </div>
        <div class="group-card" id="cardC" onclick="selectGroup('C')">
          <label style="cursor:pointer;width:100%">
            <input type="radio" name="group" value="C" id="groupC" required>
            <span class="group-label">Группа C — параллакс только в заголовках</span>
            <div class="group-desc">Сайт с параллаксом только в заголовках секций</div>
          </label>
        </div>
      </div>

      <!-- Очки -->
      <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" id="glassesCheck">
        <label class="form-check-label" for="glassesCheck">Я в очках</label>
      </div>

      <!-- Согласия -->
      <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" id="consentDataCheck" required>
        <label class="form-check-label" for="consentDataCheck">
          Я согласен(согласна) на обработку анонимизированных данных
        </label>
      </div>
      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" id="consentExperimentCheck" required>
        <label class="form-check-label" for="consentExperimentCheck">
          Я согласен(согласна) на участие в эксперименте
        </label>
      </div>

      <button type="submit" class="btn btn-primary w-100" style="font-size:16px;padding:12px;">
        Готово → перейти к эксперименту
      </button>
    </form>
  </div>

  <script>
    function selectGroup(val) {
      document.getElementById('groupA').checked = (val === 'A');
      document.getElementById('groupB').checked = (val === 'B');
      document.getElementById('groupC').checked = (val === 'C');
      document.getElementById('cardA').classList.toggle('selected', val === 'A');
      document.getElementById('cardB').classList.toggle('selected', val === 'B');
      document.getElementById('cardC').classList.toggle('selected', val === 'C');
    }

    document.getElementById('participantForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const participantNumber = document.getElementById('participantNumber').value.trim();
      const group = document.querySelector('input[name="group"]:checked')?.value;
      const glasses = document.getElementById('glassesCheck').checked;
      const consentData = document.getElementById('consentDataCheck').checked;
      const consentExperiment = document.getElementById('consentExperimentCheck').checked;

      if (!participantNumber) { alert('Введите номер участника'); return; }
      if (!group) { alert('Выберите группу (A, B или C)'); return; }
      if (!consentData || !consentExperiment) {
        alert('Необходимо дать оба согласия'); return;
      }

      localStorage.setItem('participantInfo', JSON.stringify({
        participantNumber, group, glasses, consentData, consentExperiment
      }));
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
